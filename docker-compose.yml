# Warrior Blood MVP — Docker Compose
# Services: PostgreSQL, Redis (stub), API, Dashboard.
# Run: docker compose up -d
# Migrate: docker compose exec api alembic upgrade head

services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: blood_root
      MYSQL_DATABASE: warriorblood
      MYSQL_USER: warrior
      MYSQL_PASSWORD: blood
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "warrior", "--password=blood"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./models:/app/models
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  dashboard:
    build: .
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - API_BASE_URL=http://api:8000
    depends_on:
      - api
    command: streamlit run dashboard/chw_dashboard.py --server.port 8501 --server.address 0.0.0.0

volumes:
  mysql_data:
