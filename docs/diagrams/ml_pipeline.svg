<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#64748b"/>
    </marker>
    <marker id="arr-p" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#7c3aed"/>
    </marker>
    <marker id="arr-g" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#16a34a"/>
    </marker>
  </defs>

  <rect width="1000" height="560" fill="#f0f4f8"/>

  <!-- Title -->
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Machine Learning Pipeline — VOC Risk Predictor</text>
  <text x="500" y="54" text-anchor="middle" font-size="12" fill="#64748b">LightGBM classifier · ONNX Runtime inference · SHAP TreeExplainer explanations</text>

  <!-- ===== LEFT PANEL: TRAINING ===== -->
  <rect x="20" y="68" width="470" height="462" rx="12" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
  <rect x="20" y="68" width="470" height="36" rx="12" fill="#7c3aed"/>
  <rect x="20" y="88" width="470" height="16" fill="#7c3aed"/>
  <text x="255" y="92" text-anchor="middle" font-size="14" font-weight="700" fill="white">Training Pipeline</text>
  <text x="255" y="108" text-anchor="middle" font-size="10" fill="#e9d5ff">Runs once: python ml/train_model.py</text>

  <!-- Step 1: Synthetic Data -->
  <rect x="45" y="124" width="420" height="64" rx="8" fill="white" stroke="#a855f7" stroke-width="1.5"/>
  <text x="255" y="145" text-anchor="middle" font-size="12" font-weight="700" fill="#6d28d9">1  Synthetic SCD Data Generation</text>
  <text x="255" y="163" text-anchor="middle" font-size="10" fill="#334155">80 virtual patients × 365 days = 29,200 patient-days</text>
  <text x="255" y="178" text-anchor="middle" font-size="10" fill="#64748b">Pain, hydration, temperature, weather, VOC events | 17.7% VOC rate</text>

  <!-- Arrow -->
  <line x1="255" y1="188" x2="255" y2="204" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-p)"/>

  <!-- Step 2: Feature engineering -->
  <rect x="45" y="204" width="420" height="64" rx="8" fill="white" stroke="#a855f7" stroke-width="1.5"/>
  <text x="255" y="225" text-anchor="middle" font-size="12" font-weight="700" fill="#6d28d9">2  Feature Engineering  (ml/features.py)</text>
  <text x="255" y="243" text-anchor="middle" font-size="10" fill="#334155">16 features: pain trend, hydration score, temperature, AQI</text>
  <text x="255" y="258" text-anchor="middle" font-size="10" fill="#64748b">pain_slope_3d · pain_max_7d · med_adherence_7d · days_since_last_voc</text>

  <!-- Arrow -->
  <line x1="255" y1="268" x2="255" y2="284" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-p)"/>

  <!-- Step 3: Temporal split -->
  <rect x="45" y="284" width="420" height="54" rx="8" fill="white" stroke="#a855f7" stroke-width="1.5"/>
  <text x="255" y="305" text-anchor="middle" font-size="12" font-weight="700" fill="#6d28d9">3  Temporal Train / Test Split</text>
  <text x="255" y="323" text-anchor="middle" font-size="10" fill="#334155">Train: entries before 2024-10-01 · Test: entries after 2024-10-01</text>
  <text x="255" y="337" text-anchor="middle" font-size="10" fill="#64748b">Prevents data leakage from future observations</text>

  <!-- Arrow -->
  <line x1="255" y1="338" x2="255" y2="354" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-p)"/>

  <!-- Step 4: SMOTE -->
  <rect x="45" y="354" width="420" height="54" rx="8" fill="white" stroke="#a855f7" stroke-width="1.5"/>
  <text x="255" y="375" text-anchor="middle" font-size="12" font-weight="700" fill="#6d28d9">4  SMOTE Class Balancing</text>
  <text x="255" y="393" text-anchor="middle" font-size="10" fill="#334155">Synthetic Minority Over-sampling · scale_pos_weight = 1 (post-SMOTE)</text>
  <text x="255" y="407" text-anchor="middle" font-size="10" fill="#64748b">35,660 train samples · 50% positive rate after balancing</text>

  <!-- Arrow -->
  <line x1="255" y1="408" x2="255" y2="424" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-p)"/>

  <!-- Step 5: LightGBM -->
  <rect x="45" y="424" width="200" height="66" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="145" y="445" text-anchor="middle" font-size="11" font-weight="700" fill="#6d28d9">5a  LightGBM</text>
  <text x="145" y="462" text-anchor="middle" font-size="10" fill="#334155">400 estimators</text>
  <text x="145" y="477" text-anchor="middle" font-size="10" fill="#334155">num_leaves=31, lr=0.05</text>

  <!-- Step 5b: Calibration -->
  <rect x="265" y="424" width="200" height="66" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="365" y="445" text-anchor="middle" font-size="11" font-weight="700" fill="#6d28d9">5b  Isotonic Calibration</text>
  <text x="365" y="462" text-anchor="middle" font-size="10" fill="#334155">CalibratedClassifierCV</text>
  <text x="365" y="477" text-anchor="middle" font-size="10" fill="#334155">Platt / isotonic</text>

  <line x1="245" y1="457" x2="265" y2="457" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-p)"/>

  <!-- Export arrows -->
  <line x1="145" y1="490" x2="145" y2="510" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-p)"/>
  <line x1="365" y1="490" x2="365" y2="510" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-p)"/>

  <!-- Export boxes -->
  <rect x="45" y="510" width="175" height="30" rx="6" fill="#d1fae5" stroke="#16a34a" stroke-width="1.5"/>
  <text x="132" y="530" text-anchor="middle" font-size="10" fill="#15803d" font-weight="600">models/voc_model.lgb</text>
  <rect x="265" y="510" width="200" height="30" rx="6" fill="#d1fae5" stroke="#16a34a" stroke-width="1.5"/>
  <text x="365" y="530" text-anchor="middle" font-size="10" fill="#15803d" font-weight="600">models/voc_model.onnx  (895 KB)</text>

  <!-- ===== RIGHT PANEL: INFERENCE ===== -->
  <rect x="510" y="68" width="470" height="462" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <rect x="510" y="68" width="470" height="36" rx="12" fill="#16a34a"/>
  <rect x="510" y="88" width="470" height="16" fill="#16a34a"/>
  <text x="745" y="92" text-anchor="middle" font-size="14" font-weight="700" fill="white">Inference Pipeline</text>
  <text x="745" y="108" text-anchor="middle" font-size="10" fill="#bbf7d0">Runs on every POST /checkin request</text>

  <!-- Step A: Patient input -->
  <rect x="535" y="124" width="420" height="64" rx="8" fill="white" stroke="#4ade80" stroke-width="1.5"/>
  <text x="745" y="145" text-anchor="middle" font-size="12" font-weight="700" fill="#15803d">A  Patient Check-in Submission</text>
  <text x="745" y="163" text-anchor="middle" font-size="10" fill="#334155">pain_score · body_temp_c · fluid_intake · urine_colour · fever</text>
  <text x="745" y="178" text-anchor="middle" font-size="10" fill="#64748b">sleep_hours · med_taken · location (lat/lon) → Pydantic validated</text>

  <!-- Arrow -->
  <line x1="745" y1="188" x2="745" y2="204" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-g)"/>

  <!-- Step B: Feature computation -->
  <rect x="535" y="204" width="420" height="64" rx="8" fill="white" stroke="#4ade80" stroke-width="1.5"/>
  <text x="745" y="225" text-anchor="middle" font-size="12" font-weight="700" fill="#15803d">B  Feature Vector (16 features)</text>
  <text x="745" y="243" text-anchor="middle" font-size="10" fill="#334155">Recent diary history queried from DB for rolling features</text>
  <text x="745" y="258" text-anchor="middle" font-size="10" fill="#64748b">pain_slope_3d · pain_max_7d · med_adherence_7d · hydration_risk_score</text>

  <!-- Arrow -->
  <line x1="745" y1="268" x2="745" y2="284" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-g)"/>

  <!-- Step C: ONNX inference -->
  <rect x="535" y="284" width="420" height="54" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="745" y="305" text-anchor="middle" font-size="12" font-weight="700" fill="#6d28d9">C  ONNX Runtime Inference</text>
  <text x="745" y="323" text-anchor="middle" font-size="10" fill="#334155">numpy array → onnxruntime.InferenceSession → probability [0,1]</text>
  <text x="745" y="337" text-anchor="middle" font-size="10" fill="#64748b">Fallback: native LightGBM if ONNX session unavailable</text>

  <!-- Arrow -->
  <line x1="745" y1="338" x2="745" y2="354" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-g)"/>

  <!-- Step D: Risk tier assignment -->
  <rect x="535" y="354" width="420" height="64" rx="8" fill="white" stroke="#4ade80" stroke-width="1.5"/>
  <text x="745" y="375" text-anchor="middle" font-size="12" font-weight="700" fill="#15803d">D  Risk Tier Assignment</text>
  <!-- Risk tiers -->
  <rect x="548" y="385" width="110" height="22" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="603" y="400" text-anchor="middle" font-size="10" fill="#15803d" font-weight="600">LOW  p &lt; 0.35</text>
  <rect x="672" y="385" width="130" height="22" rx="4" fill="#fef9c3" stroke="#ca8a04" stroke-width="1"/>
  <text x="737" y="400" text-anchor="middle" font-size="10" fill="#92400e" font-weight="600">MODERATE  0.35–0.65</text>
  <rect x="816" y="385" width="126" height="22" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <text x="879" y="400" text-anchor="middle" font-size="10" fill="#b91c1c" font-weight="600">HIGH  p ≥ 0.65</text>

  <!-- Arrow -->
  <line x1="745" y1="418" x2="745" y2="434" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-g)"/>

  <!-- Step E: SHAP -->
  <rect x="535" y="434" width="420" height="54" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="745" y="455" text-anchor="middle" font-size="12" font-weight="700" fill="#6d28d9">E  SHAP TreeExplainer</text>
  <text x="745" y="473" text-anchor="middle" font-size="10" fill="#334155">Top 3 feature contributions (positive class sv[1])</text>
  <text x="745" y="487" text-anchor="middle" font-size="10" fill="#64748b">Maps SHAP keys → plain English clinical suggestion</text>

  <!-- Arrow -->
  <line x1="745" y1="488" x2="745" y2="504" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-g)"/>

  <!-- Step F: Response -->
  <rect x="535" y="504" width="420" height="16" rx="6" fill="#d1fae5" stroke="#16a34a" stroke-width="1.5"/>
  <text x="745" y="516" text-anchor="middle" font-size="10" fill="#15803d" font-weight="600">F  API response: risk_tier · risk_score · shap_factors · suggestion · hydration_status</text>

  <!-- Metrics box -->
  <rect x="510" y="520" width="470" height="0" rx="8" fill="none"/>

  <!-- Performance metrics at bottom -->
  <rect x="200" y="538" width="600" height="16" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1"/>
  <text x="500" y="550" text-anchor="middle" font-size="10" fill="#6d28d9" font-weight="600">Model performance: AUROC 0.808 (target ≥ 0.80)  ·  Brier score 0.105 (target ≤ 0.10)  ·  VOC sensitivity on test set</text>
</svg>
