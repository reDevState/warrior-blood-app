<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#64748b"/>
    </marker>
    <marker id="arr-c" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#b45309"/>
    </marker>
    <marker id="arr-p" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#15803d"/>
    </marker>
  </defs>

  <rect width="1000" height="580" fill="#f0f4f8"/>

  <!-- Title -->
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">User Journey — Warrior Blood</text>
  <text x="500" y="54" text-anchor="middle" font-size="12" fill="#64748b">Two roles: Community Health Worker (CHW) and Patient · Both access via http://localhost:8501</text>

  <!-- ═══ CHW SWIMLANE ═══ -->
  <rect x="20" y="68" width="960" height="220" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <!-- Lane label -->
  <rect x="20" y="68" width="60" height="220" rx="10" fill="#b45309"/>
  <rect x="60" y="68" width="20" height="220" fill="#b45309"/>
  <text x="50" y="200" text-anchor="middle" font-size="13" font-weight="700" fill="white" transform="rotate(-90,50,200)">Community Health Worker</text>

  <!-- CHW steps -->
  <!-- Step 1: Login -->
  <rect x="95" y="90" width="110" height="56" rx="8" fill="white" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="150" y="112" text-anchor="middle" font-size="10" font-weight="700" fill="#92400e">1  Login</text>
  <text x="150" y="128" text-anchor="middle" font-size="9" fill="#64748b">test_chw</text>
  <text x="150" y="141" text-anchor="middle" font-size="9" fill="#64748b">chwpassword</text>

  <line x1="205" y1="118" x2="225" y2="118" stroke="#b45309" stroke-width="1.5" marker-end="url(#arr-c)"/>

  <!-- Step 2: Triage dashboard -->
  <rect x="225" y="82" width="130" height="72" rx="8" fill="white" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="290" y="104" text-anchor="middle" font-size="10" font-weight="700" fill="#92400e">2  Triage Dashboard</text>
  <text x="290" y="120" text-anchor="middle" font-size="9" fill="#64748b">Patients sorted by risk</text>
  <rect x="232" y="126" width="30" height="14" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <text x="247" y="137" text-anchor="middle" font-size="8" fill="#dc2626" font-weight="600">HIGH</text>
  <rect x="267" y="126" width="48" height="14" rx="3" fill="#fef9c3" stroke="#ca8a04" stroke-width="1"/>
  <text x="291" y="137" text-anchor="middle" font-size="8" fill="#92400e" font-weight="600">MODERATE</text>
  <rect x="320" y="126" width="28" height="14" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="334" y="137" text-anchor="middle" font-size="8" fill="#15803d" font-weight="600">LOW</text>
  <text x="290" y="148" text-anchor="middle" font-size="9" fill="#64748b">Click → expand record</text>

  <line x1="355" y1="118" x2="375" y2="118" stroke="#b45309" stroke-width="1.5" marker-end="url(#arr-c)"/>

  <!-- Step 3: Patient record tabs -->
  <rect x="375" y="82" width="160" height="108" rx="8" fill="white" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="455" y="102" text-anchor="middle" font-size="10" font-weight="700" fill="#92400e">3  Patient Record</text>
  <rect x="383" y="110" width="70" height="16" rx="3" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
  <text x="418" y="122" text-anchor="middle" font-size="8" fill="#1d4ed8">Overview</text>
  <rect x="458" y="110" width="70" height="16" rx="3" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
  <text x="493" y="122" text-anchor="middle" font-size="8" fill="#1d4ed8">Pain history</text>
  <rect x="383" y="132" width="70" height="16" rx="3" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
  <text x="418" y="144" text-anchor="middle" font-size="8" fill="#1d4ed8">Hydration</text>
  <rect x="458" y="132" width="70" height="16" rx="3" fill="#fff7ed" stroke="#f59e0b" stroke-width="1"/>
  <text x="493" y="144" text-anchor="middle" font-size="8" fill="#92400e">Send alert</text>
  <text x="455" y="162" text-anchor="middle" font-size="9" fill="#64748b">30-day timeline chart</text>
  <text x="455" y="175" text-anchor="middle" font-size="9" fill="#64748b">Pain · Hydration · VOC risk</text>

  <line x1="535" y1="118" x2="555" y2="118" stroke="#b45309" stroke-width="1.5" marker-end="url(#arr-c)"/>

  <!-- Step 4: Log for patient -->
  <rect x="555" y="82" width="140" height="108" rx="8" fill="white" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="625" y="102" text-anchor="middle" font-size="10" font-weight="700" fill="#92400e">4  Log for Patient</text>
  <text x="625" y="118" text-anchor="middle" font-size="9" fill="#64748b">On behalf of patient</text>
  <text x="625" y="134" text-anchor="middle" font-size="9" fill="#64748b">during clinic visit</text>
  <rect x="563" y="142" width="124" height="14" rx="3" fill="#fff7ed" stroke="#f59e0b" stroke-width="1"/>
  <text x="625" y="153" text-anchor="middle" font-size="8" fill="#b45309">Check-in &amp; Weather</text>
  <rect x="563" y="160" width="124" height="14" rx="3" fill="#fff7ed" stroke="#f59e0b" stroke-width="1"/>
  <text x="625" y="171" text-anchor="middle" font-size="8" fill="#b45309">Pain diary</text>
  <rect x="563" y="178" width="124" height="14" rx="3" fill="#fff7ed" stroke="#f59e0b" stroke-width="1"/>
  <text x="625" y="189" text-anchor="middle" font-size="8" fill="#b45309">Hydration diary</text>

  <line x1="695" y1="118" x2="715" y2="118" stroke="#b45309" stroke-width="1.5" marker-end="url(#arr-c)"/>

  <!-- Step 5: Register patient -->
  <rect x="715" y="82" width="140" height="108" rx="8" fill="white" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="785" y="102" text-anchor="middle" font-size="10" font-weight="700" fill="#92400e">5  Register Patient</text>
  <text x="785" y="118" text-anchor="middle" font-size="9" fill="#64748b">Full name (required)</text>
  <text x="785" y="134" text-anchor="middle" font-size="9" fill="#64748b">Email address</text>
  <text x="785" y="150" text-anchor="middle" font-size="9" fill="#64748b">Phone · DOB · Diagnosis</text>
  <line x1="723" y1="162" x2="847" y2="162" stroke="#e2e8f0" stroke-width="1"/>
  <text x="785" y="176" text-anchor="middle" font-size="9" fill="#15803d">→ UUID assigned</text>
  <text x="785" y="188" text-anchor="middle" font-size="9" fill="#15803d">→ Email sent to patient</text>

  <!-- CHW alerts label -->
  <rect x="95" y="165" width="110" height="46" rx="8" fill="white" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="150" y="183" text-anchor="middle" font-size="10" font-weight="700" fill="#92400e">Send SMS Alert</text>
  <text x="150" y="199" text-anchor="middle" font-size="9" fill="#64748b">Africa's Talking</text>
  <text x="150" y="211" text-anchor="middle" font-size="9" fill="#64748b">logged to alert_log</text>
  <path d="M290,190 Q220,230 150,211" fill="none" stroke="#f59e0b" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arr-c)"/>

  <!-- ═══ PATIENT SWIMLANE ═══ -->
  <rect x="20" y="310" width="960" height="240" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
  <rect x="20" y="310" width="60" height="240" rx="10" fill="#15803d"/>
  <rect x="60" y="310" width="20" height="240" fill="#15803d"/>
  <text x="50" y="460" text-anchor="middle" font-size="13" font-weight="700" fill="white" transform="rotate(-90,50,460)">Patient</text>

  <!-- Patient steps -->
  <!-- Step A: Login -->
  <rect x="95" y="330" width="110" height="56" rx="8" fill="white" stroke="#4ade80" stroke-width="1.5"/>
  <text x="150" y="352" text-anchor="middle" font-size="10" font-weight="700" fill="#15803d">A  Login</text>
  <text x="150" y="368" text-anchor="middle" font-size="9" fill="#64748b">test_patient</text>
  <text x="150" y="381" text-anchor="middle" font-size="9" fill="#64748b">testpassword</text>

  <line x1="205" y1="358" x2="225" y2="358" stroke="#15803d" stroke-width="1.5" marker-end="url(#arr-p)"/>

  <!-- Step B: Link record -->
  <rect x="225" y="322" width="150" height="88" rx="8" fill="white" stroke="#4ade80" stroke-width="1.5"/>
  <text x="300" y="342" text-anchor="middle" font-size="10" font-weight="700" fill="#15803d">B  Link Record</text>
  <text x="300" y="358" text-anchor="middle" font-size="9" fill="#64748b">First login only</text>
  <rect x="233" y="365" width="130" height="16" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="298" y="377" text-anchor="middle" font-size="8" fill="#15803d" font-weight="600">Option A: Link by email</text>
  <rect x="233" y="385" width="130" height="16" rx="4" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="1"/>
  <text x="298" y="397" text-anchor="middle" font-size="8" fill="#0369a1" font-weight="600">Option B: Link by UUID</text>

  <line x1="375" y1="366" x2="400" y2="366" stroke="#15803d" stroke-width="1.5" marker-end="url(#arr-p)"/>

  <!-- Step C: Check-in -->
  <rect x="400" y="322" width="140" height="128" rx="8" fill="white" stroke="#4ade80" stroke-width="1.5"/>
  <text x="470" y="342" text-anchor="middle" font-size="10" font-weight="700" fill="#15803d">C  Daily Check-in</text>
  <text x="470" y="358" text-anchor="middle" font-size="9" fill="#64748b">Pain score slider</text>
  <text x="470" y="373" text-anchor="middle" font-size="9" fill="#64748b">Fluid intake (glasses)</text>
  <text x="470" y="388" text-anchor="middle" font-size="9" fill="#64748b">Urine colour (1–8)</text>
  <text x="470" y="403" text-anchor="middle" font-size="9" fill="#64748b">Temperature · Fever</text>
  <text x="470" y="418" text-anchor="middle" font-size="9" fill="#64748b">Sleep (h/m/AM/PM)</text>
  <text x="470" y="433" text-anchor="middle" font-size="9" fill="#64748b">City (65-city dropdown)</text>
  <text x="470" y="446" text-anchor="middle" font-size="9" fill="#15803d">→ Risk score + SHAP</text>

  <line x1="540" y1="386" x2="560" y2="386" stroke="#15803d" stroke-width="1.5" marker-end="url(#arr-p)"/>

  <!-- Step D: Pain diary -->
  <rect x="560" y="322" width="130" height="108" rx="8" fill="white" stroke="#4ade80" stroke-width="1.5"/>
  <text x="625" y="342" text-anchor="middle" font-size="10" font-weight="700" fill="#15803d">D  Pain Diary</text>
  <text x="625" y="358" text-anchor="middle" font-size="9" fill="#64748b">Pain score · Locations</text>
  <text x="625" y="374" text-anchor="middle" font-size="9" fill="#64748b">Triggers checkboxes</text>
  <text x="625" y="390" text-anchor="middle" font-size="9" fill="#64748b">Medication + relief</text>
  <text x="625" y="406" text-anchor="middle" font-size="9" fill="#64748b">Free-text notes</text>
  <text x="625" y="422" text-anchor="middle" font-size="9" fill="#15803d">→ Breakthrough flag</text>

  <line x1="690" y1="376" x2="710" y2="376" stroke="#15803d" stroke-width="1.5" marker-end="url(#arr-p)"/>

  <!-- Step E: Hydration diary -->
  <rect x="710" y="322" width="130" height="108" rx="8" fill="white" stroke="#4ade80" stroke-width="1.5"/>
  <text x="775" y="342" text-anchor="middle" font-size="10" font-weight="700" fill="#15803d">E  Hydration Diary</text>
  <text x="775" y="358" text-anchor="middle" font-size="9" fill="#64748b">Drink type + volume</text>
  <text x="775" y="374" text-anchor="middle" font-size="9" fill="#64748b">Urine colour · Thirst</text>
  <text x="775" y="390" text-anchor="middle" font-size="9" fill="#64748b">Symptom flags</text>
  <text x="775" y="406" text-anchor="middle" font-size="9" fill="#64748b">WHO 2000 ml target</text>
  <text x="775" y="422" text-anchor="middle" font-size="9" fill="#15803d">→ Daily total gauge</text>

  <line x1="840" y1="376" x2="860" y2="376" stroke="#15803d" stroke-width="1.5" marker-end="url(#arr-p)"/>

  <!-- Step F: My history -->
  <rect x="860" y="322" width="108" height="88" rx="8" fill="white" stroke="#4ade80" stroke-width="1.5"/>
  <text x="914" y="342" text-anchor="middle" font-size="10" font-weight="700" fill="#15803d">F  My History</text>
  <text x="914" y="358" text-anchor="middle" font-size="9" fill="#64748b">30-day timeline</text>
  <text x="914" y="374" text-anchor="middle" font-size="9" fill="#64748b">Pain + VOC risk</text>
  <text x="914" y="390" text-anchor="middle" font-size="9" fill="#64748b">Breakthrough events</text>
  <text x="914" y="405" text-anchor="middle" font-size="9" fill="#64748b">marked with ⭐</text>

  <!-- Hydration guide -->
  <rect x="710" y="440" width="260" height="52" rx="8" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="840" y="460" text-anchor="middle" font-size="10" font-weight="700" fill="#0369a1">Hydration Guide</text>
  <text x="840" y="476" text-anchor="middle" font-size="9" fill="#334155">Armstrong urine colour chart (1–8)</text>
  <text x="840" y="488" text-anchor="middle" font-size="9" fill="#334155">WHO oral rehydration guidelines for SCD</text>

  <!-- Cross-lane sync arrow -->
  <path d="M470,450 C470,490 290,490 290,310" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arr)"/>
  <text x="340" y="510" text-anchor="middle" font-size="9" fill="#64748b">Patient data updates CHW triage view in real time</text>

  <!-- JWT note -->
  <rect x="20" y="555" width="960" height="18" rx="6" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <text x="500" y="568" text-anchor="middle" font-size="9" fill="#64748b">Authentication: JWT (HS256 · 30 min expiry) · Role decoded client-side · CHW and Patient share the same Streamlit app at :8501</text>
</svg>
