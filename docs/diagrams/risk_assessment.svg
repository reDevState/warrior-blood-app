<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#64748b"/>
    </marker>
    <marker id="arr-b" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#2563eb"/>
    </marker>
    <marker id="arr-p" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect width="920" height="620" fill="#f0f4f8"/>

  <!-- Title -->
  <text x="460" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">VOC Risk Assessment — Data Flow</text>
  <text x="460" y="54" text-anchor="middle" font-size="12" fill="#64748b">From patient check-in to personalised risk score and clinical suggestion</text>

  <!-- ═══ INPUTS (left column) ═══ -->
  <rect x="20" y="68" width="210" height="440" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="20" y="68" width="210" height="30" rx="10" fill="#2563eb"/>
  <rect x="20" y="84" width="210" height="14" fill="#2563eb"/>
  <text x="125" y="88" text-anchor="middle" font-size="12" font-weight="700" fill="white">Patient Inputs</text>
  <text x="125" y="103" text-anchor="middle" font-size="10" fill="#dbeafe">POST /checkin</text>

  <!-- Input fields -->
  <rect x="32" y="112" width="186" height="22" rx="5" fill="white" stroke="#bfdbfe" stroke-width="1"/>
  <text x="42" y="127" font-size="10" fill="#1d4ed8" font-weight="600">Pain score</text>
  <text x="200" y="127" text-anchor="end" font-size="10" fill="#64748b">0 – 10 NRS</text>

  <rect x="32" y="140" width="186" height="22" rx="5" fill="white" stroke="#bfdbfe" stroke-width="1"/>
  <text x="42" y="155" font-size="10" fill="#1d4ed8" font-weight="600">Body temperature</text>
  <text x="200" y="155" text-anchor="end" font-size="10" fill="#64748b">°C</text>

  <rect x="32" y="168" width="186" height="22" rx="5" fill="white" stroke="#bfdbfe" stroke-width="1"/>
  <text x="42" y="183" font-size="10" fill="#1d4ed8" font-weight="600">Fever present</text>
  <text x="200" y="183" text-anchor="end" font-size="10" fill="#64748b">boolean</text>

  <rect x="32" y="196" width="186" height="22" rx="5" fill="white" stroke="#bfdbfe" stroke-width="1"/>
  <text x="42" y="211" font-size="10" fill="#1d4ed8" font-weight="600">Fluid intake</text>
  <text x="200" y="211" text-anchor="end" font-size="10" fill="#64748b">glasses (250 ml)</text>

  <rect x="32" y="224" width="186" height="22" rx="5" fill="white" stroke="#bfdbfe" stroke-width="1"/>
  <text x="42" y="239" font-size="10" fill="#1d4ed8" font-weight="600">Urine colour</text>
  <text x="200" y="239" text-anchor="end" font-size="10" fill="#64748b">Armstrong 1–8</text>

  <rect x="32" y="252" width="186" height="22" rx="5" fill="white" stroke="#bfdbfe" stroke-width="1"/>
  <text x="42" y="267" font-size="10" fill="#1d4ed8" font-weight="600">Medication taken</text>
  <text x="200" y="267" text-anchor="end" font-size="10" fill="#64748b">boolean</text>

  <rect x="32" y="280" width="186" height="22" rx="5" fill="white" stroke="#bfdbfe" stroke-width="1"/>
  <text x="42" y="295" font-size="10" fill="#1d4ed8" font-weight="600">Sleep hours</text>
  <text x="200" y="295" text-anchor="end" font-size="10" fill="#64748b">0 – 24</text>

  <rect x="32" y="308" width="186" height="22" rx="5" fill="white" stroke="#bfdbfe" stroke-width="1"/>
  <text x="42" y="323" font-size="10" fill="#1d4ed8" font-weight="600">Location (city)</text>
  <text x="200" y="323" text-anchor="end" font-size="10" fill="#64748b">lat / lon</text>

  <!-- Weather callout -->
  <rect x="32" y="340" width="186" height="50" rx="5" fill="#fefce8" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="125" y="356" text-anchor="middle" font-size="10" fill="#92400e" font-weight="600">OpenWeatherMap API</text>
  <text x="125" y="370" text-anchor="middle" font-size="9" fill="#b45309">temp · humidity · AQI · pm2.5</text>
  <text x="125" y="383" text-anchor="middle" font-size="9" fill="#64748b">6 h Redis cache</text>

  <!-- DB history callout -->
  <rect x="32" y="400" width="186" height="50" rx="5" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="125" y="416" text-anchor="middle" font-size="10" fill="#15803d" font-weight="600">DB: recent diary history</text>
  <text x="125" y="430" text-anchor="middle" font-size="9" fill="#15803d">pain_slope_3d · pain_max_7d</text>
  <text x="125" y="443" text-anchor="middle" font-size="9" fill="#15803d">med_adherence_7d · days_since_VOC</text>

  <!-- Pydantic badge -->
  <rect x="32" y="460" width="186" height="20" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="125" y="474" text-anchor="middle" font-size="9" fill="#1d4ed8" font-weight="600">Pydantic v2 validation at API boundary</text>

  <!-- ═══ PROCESSING (centre) ═══ -->
  <!-- Arrow: inputs → features -->
  <line x1="230" y1="290" x2="265" y2="290" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-b)"/>

  <!-- Feature engineering box -->
  <rect x="265" y="210" width="190" height="160" rx="10" fill="white" stroke="#7c3aed" stroke-width="2"/>
  <rect x="265" y="210" width="190" height="30" rx="10" fill="#7c3aed"/>
  <rect x="265" y="226" width="190" height="14" fill="#7c3aed"/>
  <text x="360" y="230" text-anchor="middle" font-size="12" font-weight="700" fill="white">16 Features</text>
  <text x="360" y="253" font-size="9" fill="#6d28d9" text-anchor="middle">ml/features.py</text>
  <text x="274" y="270" font-size="9" fill="#334155">pain_score · pain_slope_3d</text>
  <text x="274" y="284" font-size="9" fill="#334155">pain_max_7d · body_temp_c</text>
  <text x="274" y="298" font-size="9" fill="#334155">fever_present · fluid_intake</text>
  <text x="274" y="312" font-size="9" fill="#334155">urine_colour · hydration_risk</text>
  <text x="274" y="326" font-size="9" fill="#334155">med_taken · med_adherence_7d</text>
  <text x="274" y="340" font-size="9" fill="#334155">sleep_hours · ambient_temp_c</text>
  <text x="274" y="354" font-size="9" fill="#334155">humidity · aqi · prior_voc_30d</text>
  <text x="274" y="368" font-size="9" fill="#334155">days_since_last_voc</text>

  <!-- Arrow: features → ONNX -->
  <line x1="360" y1="370" x2="360" y2="400" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-p)"/>

  <!-- ONNX box -->
  <rect x="265" y="400" width="190" height="70" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="360" y="422" text-anchor="middle" font-size="12" font-weight="700" fill="#6d28d9">ONNX Runtime</text>
  <text x="360" y="440" text-anchor="middle" font-size="10" fill="#334155">voc_model.onnx  (895 KB)</text>
  <text x="360" y="456" text-anchor="middle" font-size="10" fill="#334155">→ probability  p ∈ [0, 1]</text>

  <!-- Arrow: ONNX → Risk tier -->
  <line x1="360" y1="470" x2="360" y2="500" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-p)"/>

  <!-- Risk tier box -->
  <rect x="265" y="500" width="190" height="60" rx="8" fill="white" stroke="#64748b" stroke-width="1.5"/>
  <text x="360" y="518" text-anchor="middle" font-size="10" font-weight="700" fill="#334155">Risk Tier</text>
  <rect x="272" y="524" width="52" height="18" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="298" y="537" text-anchor="middle" font-size="9" fill="#15803d" font-weight="700">LOW</text>
  <text x="299" y="550" text-anchor="middle" font-size="8" fill="#15803d">p &lt; 0.35</text>
  <rect x="334" y="524" width="72" height="18" rx="4" fill="#fef9c3" stroke="#ca8a04" stroke-width="1"/>
  <text x="370" y="537" text-anchor="middle" font-size="9" fill="#92400e" font-weight="700">MODERATE</text>
  <text x="370" y="550" text-anchor="middle" font-size="8" fill="#92400e">0.35 – 0.65</text>
  <rect x="416" y="524" width="32" height="18" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <text x="432" y="537" text-anchor="middle" font-size="9" fill="#b91c1c" font-weight="700">HIGH</text>
  <text x="432" y="550" text-anchor="middle" font-size="8" fill="#b91c1c">p ≥ 0.65</text>

  <!-- ═══ SHAP path (right of ONNX) ═══ -->
  <!-- Arrow: ONNX → SHAP -->
  <line x1="455" y1="435" x2="495" y2="435" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-p)"/>

  <!-- SHAP box -->
  <rect x="495" y="400" width="200" height="80" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="595" y="424" text-anchor="middle" font-size="12" font-weight="700" fill="#6d28d9">SHAP TreeExplainer</text>
  <text x="595" y="442" text-anchor="middle" font-size="10" fill="#334155">sv[1] positive-class shapley values</text>
  <text x="595" y="458" text-anchor="middle" font-size="10" fill="#334155">Top 3 contributing features ranked</text>
  <text x="595" y="474" text-anchor="middle" font-size="9" fill="#7c3aed">→ human-readable clinical suggestion</text>

  <!-- Hydration scoring -->
  <line x1="360" y1="395" x2="595" y2="395" stroke="#0ea5e9" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <rect x="495" y="310" width="200" height="76" rx="10" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="595" y="330" text-anchor="middle" font-size="12" font-weight="700" fill="#0369a1">Hydration Scoring</text>
  <text x="595" y="348" text-anchor="middle" font-size="10" fill="#334155">WHO 2000 ml / day target</text>
  <text x="595" y="364" text-anchor="middle" font-size="10" fill="#334155">Armstrong urine colour scale</text>
  <text x="595" y="378" text-anchor="middle" font-size="9" fill="#64748b">→ ADEQUATE | MILD | MODERATE | SEVERE</text>

  <!-- ═══ OUTPUTS (right column) ═══ -->
  <rect x="720" y="68" width="180" height="500" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <rect x="720" y="68" width="180" height="30" rx="10" fill="#16a34a"/>
  <rect x="720" y="84" width="180" height="14" fill="#16a34a"/>
  <text x="810" y="88" text-anchor="middle" font-size="12" font-weight="700" fill="white">API Response</text>
  <text x="810" y="104" text-anchor="middle" font-size="10" fill="#bbf7d0">Shown on dashboard</text>

  <!-- Output: risk score -->
  <rect x="732" y="116" width="156" height="52" rx="6" fill="white" stroke="#4ade80" stroke-width="1"/>
  <text x="810" y="134" text-anchor="middle" font-size="10" font-weight="700" fill="#15803d">Risk Gauge</text>
  <text x="810" y="150" text-anchor="middle" font-size="9" fill="#334155">risk_score (0–1)</text>
  <text x="810" y="164" text-anchor="middle" font-size="9" fill="#334155">risk_tier: LOW / MODERATE / HIGH</text>

  <rect x="732" y="178" width="156" height="52" rx="6" fill="white" stroke="#4ade80" stroke-width="1"/>
  <text x="810" y="196" text-anchor="middle" font-size="10" font-weight="700" fill="#15803d">Top Risk Factors</text>
  <text x="810" y="212" text-anchor="middle" font-size="9" fill="#334155">SHAP top 3 features</text>
  <text x="810" y="226" text-anchor="middle" font-size="9" fill="#334155">with contribution scores</text>

  <rect x="732" y="240" width="156" height="52" rx="6" fill="white" stroke="#4ade80" stroke-width="1"/>
  <text x="810" y="258" text-anchor="middle" font-size="10" font-weight="700" fill="#15803d">Clinical Suggestion</text>
  <text x="810" y="274" text-anchor="middle" font-size="9" fill="#334155">Personalised plain-English</text>
  <text x="810" y="288" text-anchor="middle" font-size="9" fill="#334155">advice based on top factors</text>

  <rect x="732" y="302" width="156" height="68" rx="6" fill="#fefce8" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="810" y="320" text-anchor="middle" font-size="10" font-weight="700" fill="#92400e">Weather Alerts</text>
  <text x="810" y="336" text-anchor="middle" font-size="9" fill="#334155">heat_stress_alert</text>
  <text x="810" y="350" text-anchor="middle" font-size="9" fill="#334155">cold_stress_alert</text>
  <text x="810" y="364" text-anchor="middle" font-size="9" fill="#334155">aqi_alert (PM2.5 threshold)</text>

  <rect x="732" y="380" width="156" height="52" rx="6" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="810" y="398" text-anchor="middle" font-size="10" font-weight="700" fill="#0369a1">Hydration Status</text>
  <text x="810" y="414" text-anchor="middle" font-size="9" fill="#334155">ADEQUATE | MILD</text>
  <text x="810" y="428" text-anchor="middle" font-size="9" fill="#334155">MODERATE | SEVERE</text>

  <!-- CHW triage note -->
  <rect x="732" y="444" width="156" height="52" rx="6" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/>
  <text x="810" y="462" text-anchor="middle" font-size="10" font-weight="700" fill="#92400e">CHW Triage Update</text>
  <text x="810" y="478" text-anchor="middle" font-size="9" fill="#334155">Patient row colour updated</text>
  <text x="810" y="492" text-anchor="middle" font-size="9" fill="#334155">in triage dashboard</text>

  <!-- Arrows into outputs -->
  <line x1="695" y1="435" x2="720" y2="435" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-p)"/>
  <line x1="695" y1="350" x2="720" y2="345" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="695" y1="406" x2="720" y2="406" stroke="#0ea5e9" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="455" y1="530" x2="720" y2="470" stroke="#64748b" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr)"/>

  <!-- Clinical references footnote -->
  <rect x="20" y="572" width="880" height="36" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <text x="460" y="586" text-anchor="middle" font-size="9" fill="#64748b" font-weight="600">Clinical references</text>
  <text x="460" y="600" text-anchor="middle" font-size="9" fill="#94a3b8">Armstrong (1994) urine colour scale · WHO (2005) oral rehydration · Machado et al. (2024) LightGBM SCD prediction · Lundberg &amp; Lee (2017) SHAP</text>
</svg>
