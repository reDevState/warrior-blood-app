<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 660" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <marker id="fk" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <circle cx="4" cy="4" r="3" fill="#64748b"/>
    </marker>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1060" height="660" fill="#f0f4f8"/>

  <!-- Title -->
  <text x="530" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Database Schema — Warrior Blood</text>
  <text x="530" y="54" text-anchor="middle" font-size="12" fill="#64748b">MySQL 8.0 · SQLAlchemy 2 ORM · UUID primary keys · Fernet-encrypted PHI columns</text>

  <!-- ══════ users ══════ -->
  <g transform="translate(20,72)">
    <rect width="200" height="198" rx="8" fill="white" stroke="#475569" stroke-width="2"/>
    <rect width="200" height="30" rx="8" fill="#475569"/>
    <rect y="16" width="200" height="14" fill="#475569"/>
    <text x="100" y="20" text-anchor="middle" font-size="13" font-weight="700" fill="white">users</text>
    <!-- PK -->
    <rect x="8" y="36" width="184" height="20" rx="3" fill="#fef9c3"/>
    <text x="16" y="50" font-size="10" fill="#92400e">🔑 id  String(36) PK UUID</text>
    <line x1="8" y1="56" x2="192" y2="56" stroke="#e2e8f0" stroke-width="1"/>
    <text x="16" y="70" font-size="10" fill="#334155">  username  String(64) UNIQUE</text>
    <text x="16" y="86" font-size="10" fill="#334155">  hashed_password  String(128)</text>
    <text x="16" y="102" font-size="10" fill="#334155">  role  String(16)</text>
    <text x="16" y="118" font-size="10" fill="#94a3b8" font-style="italic">     patient | chw | admin</text>
    <rect x="8" y="124" width="184" height="20" rx="3" fill="#fce7f3"/>
    <text x="16" y="138" font-size="10" fill="#9d174d">🔗 patient_id  String(36) FK→patients</text>
    <line x1="8" y1="144" x2="192" y2="144" stroke="#e2e8f0" stroke-width="1"/>
    <text x="16" y="158" font-size="10" fill="#334155">  is_active  Boolean</text>
    <text x="16" y="174" font-size="10" fill="#334155">  created_at  DateTime</text>
  </g>

  <!-- ══════ patients ══════ -->
  <g transform="translate(380,72)">
    <rect width="220" height="238" rx="8" fill="white" stroke="#0d9488" stroke-width="2"/>
    <rect width="220" height="30" rx="8" fill="#0d9488"/>
    <rect y="16" width="220" height="14" fill="#0d9488"/>
    <text x="110" y="20" text-anchor="middle" font-size="13" font-weight="700" fill="white">patients</text>
    <!-- PK -->
    <rect x="8" y="36" width="204" height="20" rx="3" fill="#fef9c3"/>
    <text x="16" y="50" font-size="10" fill="#92400e">🔑 id  String(36) PK UUID</text>
    <line x1="8" y1="56" x2="212" y2="56" stroke="#e2e8f0" stroke-width="1"/>
    <!-- Encrypted PHI -->
    <rect x="8" y="58" width="204" height="78" rx="3" fill="#fff7ed"/>
    <text x="16" y="72" font-size="10" fill="#c2410c" font-weight="600">  PHI (Fernet-encrypted)</text>
    <text x="16" y="88" font-size="10" fill="#334155">  name_enc  Text</text>
    <text x="16" y="104" font-size="10" fill="#334155">  phone_enc  Text</text>
    <text x="16" y="120" font-size="10" fill="#334155">  email_enc  Text</text>
    <line x1="8" y1="136" x2="212" y2="136" stroke="#e2e8f0" stroke-width="1"/>
    <text x="16" y="150" font-size="10" fill="#334155">  dob  Date</text>
    <text x="16" y="166" font-size="10" fill="#334155">  diagnosis_type  String(64)</text>
    <text x="16" y="182" font-size="10" fill="#334155">  enrolled_at  DateTime</text>
    <line x1="8" y1="188" x2="212" y2="188" stroke="#e2e8f0" stroke-width="1"/>
    <text x="16" y="204" font-size="9" fill="#64748b">← diary_entries  (cascade delete)</text>
    <text x="16" y="220" font-size="9" fill="#64748b">← pain_diary_entries  (cascade delete)</text>
    <text x="16" y="236" font-size="9" fill="#64748b">← hydration_entries  (cascade delete)</text>
  </g>

  <!-- users → patients FK line -->
  <line x1="220" y1="200" x2="380" y2="200" stroke="#9d174d" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr)"/>
  <text x="290" y="194" font-size="9" fill="#9d174d" text-anchor="middle">nullable FK</text>

  <!-- ══════ diary_entries ══════ -->
  <g transform="translate(680,72)">
    <rect width="360" height="398" rx="8" fill="white" stroke="#2563eb" stroke-width="2"/>
    <rect width="360" height="30" rx="8" fill="#2563eb"/>
    <rect y="16" width="360" height="14" fill="#2563eb"/>
    <text x="180" y="20" text-anchor="middle" font-size="13" font-weight="700" fill="white">diary_entries</text>
    <rect x="8" y="36" width="344" height="20" rx="3" fill="#fef9c3"/>
    <text x="16" y="50" font-size="10" fill="#92400e">🔑 id  String(36) PK UUID</text>
    <rect x="8" y="56" width="344" height="20" rx="3" fill="#fce7f3"/>
    <text x="16" y="70" font-size="10" fill="#9d174d">🔗 patient_id  String(36) FK→patients</text>
    <line x1="8" y1="76" x2="352" y2="76" stroke="#e2e8f0" stroke-width="1"/>
    <text x="16" y="90" font-size="10" fill="#334155">  entry_date  Date</text>
    <text x="16" y="106" font-size="10" fill="#1d4ed8" font-weight="600">  Clinical inputs</text>
    <text x="16" y="122" font-size="10" fill="#334155">  pain_score  Integer 0–10</text>
    <text x="16" y="138" font-size="10" fill="#334155">  body_temp_c  Float</text>
    <text x="16" y="154" font-size="10" fill="#334155">  fever_present  Boolean</text>
    <text x="16" y="170" font-size="10" fill="#334155">  fluid_intake_glasses  Integer</text>
    <text x="16" y="186" font-size="10" fill="#334155">  urine_colour  Integer 1–8 (Armstrong scale)</text>
    <text x="16" y="202" font-size="10" fill="#334155">  med_taken  Boolean</text>
    <text x="16" y="218" font-size="10" fill="#334155">  sleep_hours  Float</text>
    <line x1="8" y1="224" x2="352" y2="224" stroke="#e2e8f0" stroke-width="1"/>
    <text x="16" y="238" font-size="10" fill="#1d4ed8" font-weight="600">  Weather (OpenWeatherMap)</text>
    <text x="16" y="254" font-size="10" fill="#334155">  ambient_temp_c · feels_like_c · humidity_pct</text>
    <text x="16" y="270" font-size="10" fill="#334155">  aqi · pm25_ugm3</text>
    <text x="16" y="286" font-size="10" fill="#334155">  cold_stress_alert · heat_stress_alert · aqi_alert  Boolean</text>
    <line x1="8" y1="292" x2="352" y2="292" stroke="#e2e8f0" stroke-width="1"/>
    <text x="16" y="306" font-size="10" fill="#7c3aed" font-weight="600">  ML outputs</text>
    <text x="16" y="322" font-size="10" fill="#334155">  risk_score  Float  (ONNX probability)</text>
    <text x="16" y="338" font-size="10" fill="#334155">  risk_tier  String(16)  LOW | MODERATE | HIGH</text>
    <text x="16" y="354" font-size="10" fill="#334155">  hydration_status  String(32)</text>
    <text x="16" y="370" font-size="10" fill="#334155">  shap_json  Text  (top-3 factors)</text>
    <text x="16" y="386" font-size="10" fill="#334155">  created_at  DateTime</text>
  </g>

  <!-- patients → diary_entries FK -->
  <line x1="600" y1="200" x2="680" y2="200" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ══════ pain_diary_entries ══════ -->
  <g transform="translate(20,310)">
    <rect width="225" height="318" rx="8" fill="white" stroke="#dc2626" stroke-width="2"/>
    <rect width="225" height="30" rx="8" fill="#dc2626"/>
    <rect y="16" width="225" height="14" fill="#dc2626"/>
    <text x="112" y="20" text-anchor="middle" font-size="13" font-weight="700" fill="white">pain_diary_entries</text>
    <rect x="8" y="36" width="209" height="20" rx="3" fill="#fef9c3"/>
    <text x="16" y="50" font-size="10" fill="#92400e">🔑 id  String(36) PK UUID</text>
    <rect x="8" y="56" width="209" height="20" rx="3" fill="#fce7f3"/>
    <text x="16" y="70" font-size="10" fill="#9d174d">🔗 patient_id  FK→patients</text>
    <line x1="8" y1="76" x2="217" y2="76" stroke="#e2e8f0" stroke-width="1"/>
    <text x="16" y="90" font-size="10" fill="#334155">  recorded_at  DateTime</text>
    <text x="16" y="106" font-size="10" fill="#334155">  pain_score  Integer 0–10</text>
    <text x="16" y="122" font-size="10" fill="#334155">  pain_locations  String(128)</text>
    <text x="16" y="138" font-size="9" fill="#64748b">     CHEST,BACK,ABDOMEN,L_ARM...</text>
    <line x1="8" y1="144" x2="217" y2="144" stroke="#e2e8f0" stroke-width="1"/>
    <text x="16" y="158" font-size="10" fill="#b91c1c" font-weight="600">  Triggers (Boolean flags)</text>
    <text x="16" y="174" font-size="10" fill="#334155">  trigger_cold · trigger_stress</text>
    <text x="16" y="190" font-size="10" fill="#334155">  trigger_exercise · trigger_infection</text>
    <text x="16" y="206" font-size="10" fill="#334155">  trigger_dehydration · trigger_other</text>
    <line x1="8" y1="212" x2="217" y2="212" stroke="#e2e8f0" stroke-width="1"/>
    <text x="16" y="226" font-size="10" fill="#b91c1c" font-weight="600">  Medication</text>
    <text x="16" y="242" font-size="10" fill="#334155">  took_paracetamol · took_ibuprofen</text>
    <text x="16" y="258" font-size="10" fill="#334155">  took_opioid  Boolean</text>
    <text x="16" y="274" font-size="10" fill="#334155">  pain_relief_rating  Integer 0–3</text>
    <line x1="8" y1="280" x2="217" y2="280" stroke="#e2e8f0" stroke-width="1"/>
    <text x="16" y="294" font-size="10" fill="#334155">  is_breakthrough  Boolean</text>
    <text x="16" y="310" font-size="10" fill="#334155">  notes  Text</text>
  </g>

  <!-- ══════ hydration_entries ══════ -->
  <g transform="translate(270,310)">
    <rect width="225" height="278" rx="8" fill="white" stroke="#0ea5e9" stroke-width="2"/>
    <rect width="225" height="30" rx="8" fill="#0ea5e9"/>
    <rect y="16" width="225" height="14" fill="#0ea5e9"/>
    <text x="112" y="20" text-anchor="middle" font-size="13" font-weight="700" fill="white">hydration_entries</text>
    <rect x="8" y="36" width="209" height="20" rx="3" fill="#fef9c3"/>
    <text x="16" y="50" font-size="10" fill="#92400e">🔑 id  String(36) PK UUID</text>
    <rect x="8" y="56" width="209" height="20" rx="3" fill="#fce7f3"/>
    <text x="16" y="70" font-size="10" fill="#9d174d">🔗 patient_id  FK→patients</text>
    <line x1="8" y1="76" x2="217" y2="76" stroke="#e2e8f0" stroke-width="1"/>
    <text x="16" y="90" font-size="10" fill="#334155">  logged_at  DateTime</text>
    <text x="16" y="106" font-size="10" fill="#334155">  entry_date  Date</text>
    <text x="16" y="122" font-size="10" fill="#334155">  drink_type  String(32)</text>
    <text x="16" y="138" font-size="9" fill="#64748b">     Water|Juice|Milk|Tea|Coffee|Soda</text>
    <text x="16" y="154" font-size="10" fill="#334155">  drink_volume_ml  Integer</text>
    <text x="16" y="170" font-size="10" fill="#334155">  daily_total_ml  Integer</text>
    <text x="16" y="186" font-size="10" fill="#334155">  urine_colour  Integer 1–8</text>
    <text x="16" y="202" font-size="10" fill="#334155">  thirst_level  Integer 1–4</text>
    <line x1="8" y1="208" x2="217" y2="208" stroke="#e2e8f0" stroke-width="1"/>
    <text x="16" y="222" font-size="10" fill="#0369a1" font-weight="600">  Symptom flags</text>
    <text x="16" y="238" font-size="10" fill="#334155">  dry_mouth · dizziness</text>
    <text x="16" y="254" font-size="10" fill="#334155">  headache · dark_urine_flag  Boolean</text>
  </g>

  <!-- ══════ alert_log ══════ -->
  <g transform="translate(530,310)">
    <rect width="200" height="198" rx="8" fill="white" stroke="#f59e0b" stroke-width="2"/>
    <rect width="200" height="30" rx="8" fill="#f59e0b"/>
    <rect y="16" width="200" height="14" fill="#f59e0b"/>
    <text x="100" y="20" text-anchor="middle" font-size="13" font-weight="700" fill="white">alert_log</text>
    <rect x="8" y="36" width="184" height="20" rx="3" fill="#fef9c3"/>
    <text x="16" y="50" font-size="10" fill="#92400e">🔑 id  String(36) PK UUID</text>
    <rect x="8" y="56" width="184" height="20" rx="3" fill="#fce7f3"/>
    <text x="16" y="70" font-size="10" fill="#9d174d">🔗 patient_id  FK→patients</text>
    <line x1="8" y1="76" x2="192" y2="76" stroke="#e2e8f0" stroke-width="1"/>
    <text x="16" y="90" font-size="10" fill="#334155">  channel  String(16)</text>
    <text x="16" y="106" font-size="9" fill="#64748b">     sms | push</text>
    <text x="16" y="122" font-size="10" fill="#334155">  message  Text</text>
    <text x="16" y="138" font-size="10" fill="#334155">  delivered  Boolean</text>
    <text x="16" y="154" font-size="10" fill="#334155">  sent_at  DateTime</text>
  </g>

  <!-- ══════ chw_actions ══════ -->
  <g transform="translate(760,310)">
    <rect width="200" height="178" rx="8" fill="white" stroke="#b45309" stroke-width="2"/>
    <rect width="200" height="30" rx="8" fill="#b45309"/>
    <rect y="16" width="200" height="14" fill="#b45309"/>
    <text x="100" y="20" text-anchor="middle" font-size="13" font-weight="700" fill="white">chw_actions</text>
    <rect x="8" y="36" width="184" height="20" rx="3" fill="#fef9c3"/>
    <text x="16" y="50" font-size="10" fill="#92400e">🔑 id  String(36) PK UUID</text>
    <rect x="8" y="56" width="184" height="20" rx="3" fill="#fce7f3"/>
    <text x="16" y="70" font-size="10" fill="#9d174d">🔗 patient_id  FK→patients</text>
    <line x1="8" y1="76" x2="192" y2="76" stroke="#e2e8f0" stroke-width="1"/>
    <text x="16" y="90" font-size="10" fill="#334155">  action_type  String(64)</text>
    <text x="16" y="106" font-size="9" fill="#64748b">     check_in | pain | hydration | alert</text>
    <text x="16" y="122" font-size="10" fill="#334155">  notes  Text</text>
    <text x="16" y="138" font-size="10" fill="#334155">  created_at  DateTime</text>
  </g>

  <!-- FK relationship lines: patients → child tables -->
  <!-- patients (380+110=490 center, bottom = 310) → pain_diary_entries (top center 20+112=132) -->
  <path d="M490,310 L490,296 L132,296 L132,310" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <!-- patients → hydration_entries -->
  <path d="M490,310 L490,296 L382,296 L382,310" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <!-- patients → alert_log -->
  <path d="M490,310 L490,296 L630,296 L630,310" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <!-- patients → chw_actions -->
  <path d="M490,310 L490,296 L860,296 L860,310" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)"/>

  <!-- Legend -->
  <rect x="20" y="636" width="620" height="18" rx="6" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="28" y="642" width="12" height="6" rx="2" fill="#fef9c3" stroke="#92400e" stroke-width="1"/>
  <text x="46" y="652" font-size="9" fill="#64748b">PK — primary key (UUID)</text>
  <rect x="150" y="642" width="12" height="6" rx="2" fill="#fce7f3" stroke="#9d174d" stroke-width="1"/>
  <text x="168" y="652" font-size="9" fill="#64748b">FK — foreign key to patients</text>
  <rect x="310" y="642" width="12" height="6" rx="2" fill="#fff7ed" stroke="#c2410c" stroke-width="1"/>
  <text x="328" y="652" font-size="9" fill="#64748b">PHI — Fernet-encrypted at rest</text>
  <text x="500" y="652" font-size="9" fill="#64748b">All tables: cascade="all, delete-orphan" on Patient</text>
</svg>
